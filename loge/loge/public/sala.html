<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loge</title>
  <meta name="theme-color" content="#0e0f13">
  <!-- iPhone: "Adicionar à Tela de Início" abre o Loge sem a barra do Safari (tela inteira de verdade) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="entrada">
    <div class="cartao">
      <img src="/logo.svg" alt="" width="96" height="96">
      <h1 class="marca">Loge</h1>
      <span class="filete"></span>
      <p id="sala-nome" class="tag" hidden></p>
      <div id="quem" hidden><span id="quem-foto" class="disco"></span><strong id="quem-nome"></strong></div>
      <p id="dica-entrada" class="sub">Escolha um nome para entrar na sala.</p>
      <input id="nome" placeholder="Seu nome" maxlength="24" autofocus>
      <input id="senha" type="password" placeholder="Senha da sala" maxlength="64" hidden>
      <p id="erro-senha" class="sub" hidden></p>
      <button id="entrar" class="btn primario grande">Entrar</button>
      <a id="criar-perfil-link" class="link" href="/" hidden>Criar um perfil com foto</a>
    </div>
  </div>

  <div id="sala" hidden>
    <header id="barra">
      <a class="logo-link" href="/" title="Início">
        <img src="/logo.svg" alt="" width="30" height="30">
        <span class="marca mini">Loge</span>
      </a>
      <div class="acoes">
        <span id="status" class="presenca" data-conexao="conectando" title="Conectando…"><i id="conexao-ponto" class="ponto"></i><span id="contagem">1 na sala</span><span id="conexao-txt" class="conexao-txt">Conectando…</span></span>
        <button id="mic" class="btn" aria-pressed="false" title="Entrar no chat de voz (depois, M muta e desmuta)">
          <svg class="ico-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <svg class="ico-mudo" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></svg>
          <span id="mic-txt">Entrar na voz</span>
        </button>
        <button id="copiar" class="btn" title="Compartilhar convite ou copiar link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          <span id="copiar-txt">Convidar</span>
        </button>
        <button id="liberar" class="btn" hidden>Liberar palco</button>
        <label id="arquivo-label" class="btn" for="arquivo">Arquivo local</label>
        <input id="arquivo" type="file" accept="video/*" hidden>
        <button id="parar" class="btn" hidden>Parar</button>
        <button id="tela" class="btn primario">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 14V8m0 0-3 3m3-3 3 3M8 20h8"/></svg>
          Compartilhar tela
        </button>
      </div>
    </header>

    <main id="principal">
      <div id="quadro">
        <div id="palco"></div>
        <div id="transmissao-encerrada" class="transmissao-encerrada" hidden role="status" aria-live="polite">
          <svg class="robo-sonolento" viewBox="0 90 810 900" role="img" aria-label="Robozinho lanterninha de cinema dormindo sentado, de quepe vermelho, olhos fechados e uma bolha no nariz, com a lanterna caída no chão ao lado">
            <defs>
              <linearGradient id="rb-capacete" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#9a9ca7"/><stop offset=".6" stop-color="#80828d"/><stop offset="1" stop-color="#6c6e79"/>
              </linearGradient>
              <linearGradient id="rb-corpo" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8c8e98"/><stop offset=".5" stop-color="#777982"/><stop offset="1" stop-color="#62646d"/>
              </linearGradient>
              <linearGradient id="rb-braco" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#53555f"/><stop offset="1" stop-color="#3b3d47"/>
              </linearGradient>
              <linearGradient id="rb-bolha" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#9dbcf2"/><stop offset="1" stop-color="#7fa4e8"/>
              </linearGradient>
              <linearGradient id="rb-quepe" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#b8383f"/><stop offset="1" stop-color="#85262c"/>
              </linearGradient>
              <linearGradient id="rb-ouro" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e3bf63"/><stop offset="1" stop-color="#b88a2e"/>
              </linearGradient>
              <linearGradient id="rb-lanterna" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4a4c57"/><stop offset="1" stop-color="#25272e"/>
              </linearGradient>
              <radialGradient id="rb-brilho" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <ellipse cx="440" cy="930" rx="305" ry="28" fill="#000" fill-opacity=".42"/>
            <!-- lanterna do lanterninha, caída no chão -->
            <g class="robot-lanterna" transform="rotate(-4 130 915) translate(200 915) scale(1.2) translate(-200 -915)">
              <ellipse cx="122" cy="936" rx="92" ry="8" fill="#000" fill-opacity=".4"/>
              <circle cx="44" cy="915" r="46" fill="url(#rb-brilho)"/>
              <rect x="78" y="901" width="116" height="30" rx="10" fill="url(#rb-lanterna)" stroke="#5b5d69" stroke-opacity=".7" stroke-width="3"/>
              <rect x="96" y="901" width="7" height="30" fill="url(#rb-ouro)"/>
              <rect x="152" y="901" width="7" height="30" fill="url(#rb-ouro)"/>
              <rect x="84" y="905" width="104" height="5" rx="2.5" fill="#fff" fill-opacity=".16"/>
              <circle cx="127" cy="903" r="5" fill="url(#rb-ouro)"/>
              <path d="M80 894 L52 882 Q46 881 46 888 L46 942 Q46 949 52 948 L80 937 Z" fill="#5a5c68" stroke="#7a7c8a" stroke-opacity=".7" stroke-width="3" stroke-linejoin="round"/>
              <ellipse cx="46" cy="915" rx="7" ry="27" fill="#ffe7a0"/>
              <ellipse cx="44" cy="915" rx="3" ry="18" fill="#fff6d8" fill-opacity=".9"/>
              <rect x="188" y="904" width="10" height="24" rx="4" fill="#2b2d35" stroke="#5b5d69" stroke-opacity=".6" stroke-width="2"/>
            </g>
            <g class="robot-body">
              <!-- braços -->
              <path d="M272 704 C226 744 196 806 196 862 C196 892 226 910 254 900 C266 880 276 846 278 790 Z" fill="url(#rb-braco)" stroke="#b9bdd0" stroke-opacity=".8" stroke-width="5" stroke-linejoin="round"/>
              <path d="M574 704 C620 744 650 806 650 862 C650 892 620 910 592 900 C580 880 570 846 568 790 Z" fill="url(#rb-braco)" stroke="#b9bdd0" stroke-opacity=".8" stroke-width="5" stroke-linejoin="round"/>
              <g class="robot-belly">
                <!-- corpo (ovo) -->
                <path d="M296 712 C340 696 506 696 552 712 C584 738 594 800 586 858 C580 904 548 934 422 934 C296 934 264 904 258 858 C250 800 262 738 296 712 Z" fill="url(#rb-corpo)" stroke="#b6bad0" stroke-opacity=".65" stroke-width="4.5" stroke-linejoin="round"/>
                <path d="M362 773 Q416 788 472 773" fill="none" stroke="#a9bfeb" stroke-width="5" stroke-linecap="round" opacity=".8"/>
                <!-- coxas -->
                <path d="M270 880 C262 852 300 842 332 850 C362 858 366 902 352 930 C318 938 286 934 272 908 Z" fill="#8a8c96" stroke="#c9cddd" stroke-opacity=".6" stroke-width="4" stroke-linejoin="round"/>
                <path d="M574 880 C582 852 544 842 512 850 C482 858 478 902 492 930 C526 938 558 934 572 908 Z" fill="#8a8c96" stroke="#c9cddd" stroke-opacity=".6" stroke-width="4" stroke-linejoin="round"/>
                <!-- pés -->
                <ellipse cx="358" cy="910" rx="40" ry="52" fill="#2b2d36" stroke="#555766" stroke-opacity=".7" stroke-width="3.5"/>
                <ellipse cx="522" cy="912" rx="40" ry="50" fill="#2b2d36" stroke="#555766" stroke-opacity=".7" stroke-width="3.5"/>
              </g>
              <!-- orelhas -->
              <rect x="231" y="565" width="38" height="92" rx="19" fill="#4d4f5a" stroke="#b9bdd0" stroke-opacity=".85" stroke-width="5"/>
              <path d="M590 598 C602 598 607 614 605 636 C601 650 596 652 589 650 Z" fill="#4d4f5a" stroke="#9fa3b6" stroke-opacity=".8" stroke-width="4"/>
              <!-- cabeça -->
              <path d="M268 566 C260 484 332 440 426 440 C522 440 592 484 597 566 L599 650 C599 706 540 738 426 738 C312 738 257 708 261 646 Z" fill="url(#rb-capacete)" stroke="#bfc3d6" stroke-opacity=".7" stroke-width="5.5" stroke-linejoin="round"/>
              <path d="M308 568 C308 510 360 488 432 488 C514 488 562 508 566 566 L568 636 C568 686 514 696 432 696 C350 696 302 686 304 636 Z" fill="#06070b" stroke="#1d1f29" stroke-width="3"/>
              <path d="M338 601 Q372 634 406 601 M462 601 Q496 634 530 601" fill="none" stroke="#a6c1f3" stroke-width="7" stroke-linecap="round"/>
              <!-- quepe de lanterninha de cinema (inclinado, meio caído de sono) -->
              <g class="robot-quepe" transform="rotate(-5 425 472)">
                <path d="M296 484 L311 410 Q313 399 324 399 L526 399 Q537 399 539 410 L554 484 Q555 496 543 496 L307 496 Q295 496 296 484 Z" fill="url(#rb-quepe)" stroke="#6f1d22" stroke-opacity=".8" stroke-width="4" stroke-linejoin="round"/>
                <ellipse cx="425" cy="400" rx="100" ry="12" fill="#c9484f" stroke="#e3bf63" stroke-width="4"/>
                <path d="M298 464 L552 464 L555 490 Q556 496 546 496 L304 496 Q294 496 296 490 Z" fill="url(#rb-ouro)" stroke="#8a6620" stroke-opacity=".8" stroke-width="3" stroke-linejoin="round"/>
                <path d="M306 478 L544 478" stroke="#8a6620" stroke-opacity=".35" stroke-width="2"/>
                <path d="M425 413 L431 428 L448 429 L435 439 L440 455 L425 446 L410 455 L415 439 L402 429 L419 428 Z" fill="url(#rb-ouro)" stroke="#8a6620" stroke-opacity=".7" stroke-width="2" stroke-linejoin="round"/>
                <circle cx="425" cy="392" r="7" fill="url(#rb-ouro)" stroke="#8a6620" stroke-opacity=".7" stroke-width="2"/>
              </g>
              <!-- antena (sai do quepe) -->
              <path d="M360 399 L338 364" fill="none" stroke="#9a9cab" stroke-width="6.5" stroke-linecap="round"/>
              <circle cx="332" cy="353" r="16" fill="#aeb0be"/>
              <circle cx="327" cy="347" r="5" fill="#d2d4df" fill-opacity=".7"/>
            </g>
            <g class="robot-bubble">
              <circle cx="585" cy="560" r="52" fill="url(#rb-bolha)" fill-opacity=".94" stroke="#e3edff" stroke-opacity=".95" stroke-width="5"/>
              <ellipse cx="567" cy="560" rx="11" ry="34" fill="#fff" fill-opacity=".14"/>
              <circle cx="611" cy="530" r="5.5" fill="#fff" fill-opacity=".8"/>
            </g>
            <g class="robot-zzz" fill="#9db8ef" font-family="Inter, system-ui, sans-serif" font-weight="500">
              <text x="568" y="424" font-size="50">Z</text><text x="606" y="352" font-size="60">Z</text><text x="650" y="262" font-size="72">Z</text><text x="716" y="168" font-size="80">Z</text>
            </g>
          </svg>
          <h2>Transmissão encerrada</h2>
          <p>O anfitrião saiu da sala ou a transmissão foi finalizada.</p>
          <p class="transmissao-dica">A sala continua ativa. Vocês podem conversar normalmente.</p>
        </div>
        <div id="reacoes" aria-live="off" aria-label="Reações ao vivo"></div>
        <button id="sair-cheia" class="btn icone" hidden aria-label="Sair da tela cheia" title="Sair da tela cheia">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div id="controles">
        <div id="qualidade" class="grupo">
          <details>
            <summary class="btn">Qualidade</summary>
            <div class="painel">
              <select id="res" title="Resolução (vale na próxima transmissão de tela)">
                <option value="1920x1080">1080p</option>
                <option value="2560x1440">1440p</option>
                <option value="3840x2160">4K</option>
              </select>
              <select id="fps" title="Quadros por segundo">
                <option value="30">30 fps</option>
                <option value="60" selected>60 fps</option>
              </select>
              <select id="bitrate" title="Bitrate máximo">
                <option value="4">4 Mbps</option>
                <option value="8" selected>8 Mbps</option>
                <option value="15">15 Mbps</option>
                <option value="25">25 Mbps</option>
                <option value="40">40 Mbps</option>
              </select>
              <select id="codec" title="Codec (vale na próxima transmissão)">
                <option value="auto">Codec: auto</option>
                <option value="H264">H.264</option>
                <option value="VP9">VP9</option>
                <option value="AV1">AV1</option>
                <option value="VP8">VP8</option>
              </select>
              <select id="dica" title="Prioridade">
                <option value="detail">Nitidez</option>
                <option value="motion">Movimento</option>
              </select>
            </div>
          </details>
          <span id="stats"></span>
        </div>

        <div id="remoto" class="grupo" hidden>
          <input id="rc-seek" type="range" min="0" max="1000" value="0" hidden>
          <span id="rc-tempo" hidden></span>
          <label class="vol">Volume <input id="rc-vol" type="range" min="0" max="100" value="100"></label>
        </div>

        <div class="grupo">
          <label class="cinema-card" for="cinema">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>
            <span class="textos"><strong>Modo cinema</strong><small>Apague as luzes</small></span>
            <input id="cinema" type="checkbox">
            <span class="chave"></span>
          </label>
          <button id="reagir" class="btn" type="button" title="Enviar uma reação GIF sobre a transmissão">✦ Reagir</button>
          <button id="tela-cheia" class="btn icone" title="Tela cheia" aria-label="Tela cheia">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>
    </main>

    <aside id="lateral">
      <div class="lateral-topo">
        <h2 class="marca-titulo">A sala</h2>
        <span class="ao-vivo">Ao vivo</span>
      </div>
      <div id="avatares"></div>
      <div id="chat">
        <div id="msgs"></div>
        <section id="gif-panel" class="gif-painel" hidden aria-label="Buscar GIFs">
          <div class="gif-painel-topo">
            <input id="gif-search" type="search" placeholder="Buscar GIFs..." autocomplete="off" aria-label="Buscar GIFs">
            <button id="gif-close" class="gif-fechar" type="button" aria-label="Fechar seletor de GIFs">×</button>
          </div>
          <div id="gif-results" class="gif-resultados" aria-live="polite"></div>
          <small class="gif-credito">GIFs fornecidos pelo GIPHY</small>
        </section>
        <form id="form">
          <button id="gif-btn" class="gif-botao" type="button" aria-label="Escolher GIF" aria-expanded="false" title="Enviar GIF">GIF</button>
          <input id="texto" placeholder="Diga alguma coisa..." maxlength="500" autocomplete="off" enterkeyhint="send">
          <button class="enviar" aria-label="Enviar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg>
          </button>
        </form>
      </div>
    </aside>
  </div>

  <div id="vol-pop" class="vol-pop" hidden role="dialog" aria-label="Volume deste colega">
    <strong id="vol-nome"></strong>
    <div class="vol-linha">
      <input id="vol-range" type="range" min="0" max="300" step="5" value="100" aria-label="Volume deste colega">
      <output id="vol-valor" for="vol-range">100%</output>
    </div>
    <button id="vol-normal" class="btn" type="button">Voltar ao normal</button>
  </div>
  <div id="voz" hidden></div> <!-- onde tocam os áudios dos outros (chat de voz) -->
  <script type="module" src="/app.js"></script>
</body>
</html>
