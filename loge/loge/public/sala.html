<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loge</title>
  <meta name="theme-color" content="#0e0f13">
  <!-- iPhone: "Adicionar à Tela de Início" abre o Loge sem a barra do Safari (tela inteira de verdade) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="entrada">
    <div class="cartao">
      <img src="/logo.svg" alt="" width="96" height="96">
      <h1 class="marca">Loge</h1>
      <span class="filete"></span>
      <p id="sala-nome" class="tag" hidden></p>
      <div id="quem" hidden><span id="quem-foto" class="disco"></span><strong id="quem-nome"></strong></div>
      <p id="dica-entrada" class="sub">Escolha um nome para entrar na sala.</p>
      <input id="nome" placeholder="Seu nome" maxlength="24" autofocus>
      <input id="senha" type="password" placeholder="Senha da sala" maxlength="64" hidden>
      <p id="erro-senha" class="sub" hidden></p>
      <button id="entrar" class="btn primario grande">Entrar</button>
      <a id="criar-perfil-link" class="link" href="/" hidden>Criar um perfil com foto</a>
    </div>
  </div>

  <div id="sala" hidden>
    <header id="barra">
      <a class="logo-link" href="/" title="Início">
        <img src="/logo.svg" alt="" width="30" height="30">
        <span class="marca mini">Loge</span>
      </a>
      <div class="acoes">
        <span id="status" class="presenca" data-conexao="conectando" title="Conectando…"><i id="conexao-ponto" class="ponto"></i><span id="contagem">1 na sala</span><span id="conexao-txt" class="conexao-txt">Conectando…</span></span>
        <button id="mic" class="btn" aria-pressed="false" title="Entrar no chat de voz (depois, M muta e desmuta)">
          <svg class="ico-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <svg class="ico-mudo" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></svg>
          <span id="mic-txt">Entrar na voz</span>
        </button>
        <button id="copiar" class="btn" title="Compartilhar convite ou copiar link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          <span id="copiar-txt">Convidar</span>
        </button>
        <button id="liberar" class="btn" hidden>Liberar palco</button>
        <label id="arquivo-label" class="btn" for="arquivo">Arquivo local</label>
        <input id="arquivo" type="file" accept="video/*" hidden>
        <button id="parar" class="btn" hidden>Parar</button>
        <button id="tela" class="btn primario">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 14V8m0 0-3 3m3-3 3 3M8 20h8"/></svg>
          Compartilhar tela
        </button>
      </div>
    </header>

    <main id="principal">
      <div id="quadro">
        <div id="palco"></div>
        <div id="transmissao-encerrada" class="transmissao-encerrada" hidden role="status" aria-live="polite">
          <svg class="robo-sonolento" viewBox="0 0 240 190" role="img" aria-label="Robozinho dormindo sentado, com uma barriguinha e uma bolha no nariz">
            <g class="robot-body">
            <g fill="none" stroke="#aeb8d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M74 112 Q56 125 52 147 Q49 158 62 160 L78 155"/>
              <path d="M166 112 Q184 125 188 147 Q191 158 178 160 L162 155"/>
              <g class="robot-belly">
              <path d="M80 104 Q62 127 78 151 Q94 167 120 165 Q147 166 162 150 Q177 127 160 104"/>
              <path d="M91 144 Q120 158 149 144" opacity=".5"/>
              </g>
              <path d="M83 66 Q83 39 120 39 Q157 39 157 66 L157 91 Q157 112 120 113 Q83 112 83 91 Z" fill="#c6c8d8" fill-opacity=".12"/>
              <path d="M96 83 Q103 91 110 83 M130 83 Q137 91 144 83" stroke-width="3.5"/>
              <path d="M120 39 L114 27" opacity=".8"/>
              <circle cx="111" cy="23" r="4" fill="#aeb8d7" stroke="none"/>
              <g class="robot-belly">
              <path d="M92 116 Q120 107 148 116" opacity=".6"/>
              <path d="M102 123 Q120 117 138 123" opacity=".5"/>
              </g>
              <path d="M93 151 Q81 167 91 174 Q102 180 110 167"/>
              <path d="M147 151 Q159 167 149 174 Q138 180 130 167"/>
            </g>
            </g>
            <path class="robot-bubble" d="M148 72 C160 62 173 68 173 79 C173 91 158 94 150 84 Z" fill="#a8c8ff" fill-opacity=".82"/>
            <g class="robot-zzz" fill="#a8c8ff" font-family="Inter, sans-serif" font-weight="600">
              <text x="160" y="51" font-size="18">z</text><text x="176" y="37" font-size="22">z</text><text x="195" y="20" font-size="27">z</text>
            </g>
          </svg>
          <h2>Transmissão encerrada</h2>
          <p>O anfitrião saiu da sala ou a transmissão foi finalizada.</p>
          <p class="transmissao-dica">A sala continua ativa. Vocês podem conversar normalmente.</p>
        </div>
        <div id="reacoes" aria-live="off" aria-label="Reações ao vivo"></div>
        <button id="sair-cheia" class="btn icone" hidden aria-label="Sair da tela cheia" title="Sair da tela cheia">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div id="controles">
        <div id="qualidade" class="grupo">
          <details>
            <summary class="btn">Qualidade</summary>
            <div class="painel">
              <select id="res" title="Resolução (vale na próxima transmissão de tela)">
                <option value="1920x1080">1080p</option>
                <option value="2560x1440">1440p</option>
                <option value="3840x2160">4K</option>
              </select>
              <select id="fps" title="Quadros por segundo">
                <option value="30">30 fps</option>
                <option value="60" selected>60 fps</option>
              </select>
              <select id="bitrate" title="Bitrate máximo">
                <option value="4">4 Mbps</option>
                <option value="8" selected>8 Mbps</option>
                <option value="15">15 Mbps</option>
                <option value="25">25 Mbps</option>
                <option value="40">40 Mbps</option>
              </select>
              <select id="codec" title="Codec (vale na próxima transmissão)">
                <option value="auto">Codec: auto</option>
                <option value="H264">H.264</option>
                <option value="VP9">VP9</option>
                <option value="AV1">AV1</option>
                <option value="VP8">VP8</option>
              </select>
              <select id="dica" title="Prioridade">
                <option value="detail">Nitidez</option>
                <option value="motion">Movimento</option>
              </select>
            </div>
          </details>
          <span id="stats"></span>
        </div>

        <div id="remoto" class="grupo" hidden>
          <input id="rc-seek" type="range" min="0" max="1000" value="0" hidden>
          <span id="rc-tempo" hidden></span>
          <label class="vol">Volume <input id="rc-vol" type="range" min="0" max="100" value="100"></label>
        </div>

        <div class="grupo">
          <label class="cinema-card" for="cinema">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>
            <span class="textos"><strong>Modo cinema</strong><small>Apague as luzes</small></span>
            <input id="cinema" type="checkbox">
            <span class="chave"></span>
          </label>
          <button id="reagir" class="btn" type="button" title="Enviar uma reação GIF sobre a transmissão">✦ Reagir</button>
          <button id="tela-cheia" class="btn icone" title="Tela cheia" aria-label="Tela cheia">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>
    </main>

    <aside id="lateral">
      <div class="lateral-topo">
        <h2 class="marca-titulo">A sala</h2>
        <span class="ao-vivo">Ao vivo</span>
      </div>
      <div id="avatares"></div>
      <div id="chat">
        <div id="msgs"></div>
        <section id="gif-panel" class="gif-painel" hidden aria-label="Buscar GIFs">
          <div class="gif-painel-topo">
            <input id="gif-search" type="search" placeholder="Buscar GIFs..." autocomplete="off" aria-label="Buscar GIFs">
            <button id="gif-close" class="gif-fechar" type="button" aria-label="Fechar seletor de GIFs">×</button>
          </div>
          <div id="gif-results" class="gif-resultados" aria-live="polite"></div>
          <small class="gif-credito">GIFs fornecidos pelo GIPHY</small>
        </section>
        <form id="form">
          <button id="gif-btn" class="gif-botao" type="button" aria-label="Escolher GIF" aria-expanded="false" title="Enviar GIF">GIF</button>
          <input id="texto" placeholder="Diga alguma coisa..." maxlength="500" autocomplete="off" enterkeyhint="send">
          <button class="enviar" aria-label="Enviar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg>
          </button>
        </form>
      </div>
    </aside>
  </div>

  <div id="voz" hidden></div> <!-- onde tocam os áudios dos outros (chat de voz) -->
  <script type="module" src="/app.js"></script>
</body>
</html>
