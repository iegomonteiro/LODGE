<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loge · Seu camarote particular</title>
  <meta name="theme-color" content="#0e0f13">
  <link rel="icon" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="entrada">
    <div class="cartao">
      <img src="/logo.svg" alt="" width="120" height="120">
      <h1 class="marca">Loge</h1>
      <span class="filete"></span>
      <p class="tag">Seu camarote particular.</p>
      <input id="senha-sala" type="password" placeholder="Senha da sala (opcional)" maxlength="64">
      <button id="criar" class="btn primario grande">Criar sala</button>
      <p class="sub">Depois é só mandar o link para os amigos.</p>
    </div>
  </main>
  <script>
    // getRandomValues funciona também em HTTP puro; randomUUID exige contexto seguro (HTTPS/localhost)
    const novoId = () =>
      Array.from(crypto.getRandomValues(new Uint8Array(4)), (b) => b.toString(16).padStart(2, "0")).join("");
    document.getElementById("criar").onclick = () => {
      const id = novoId();
      const senha = document.getElementById("senha-sala").value;
      if (senha) sessionStorage.setItem("senha:" + id, senha);
      location.href = "/sala/" + id;
    };
  </script>
</body>
</html>
